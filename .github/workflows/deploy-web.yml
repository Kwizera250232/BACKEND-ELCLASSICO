name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages (workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1
          if [ $? -ne 0 ]; then
            gh api "repos/${{ github.repository }}/pages" -X POST -f build_type=workflow
            echo "Created Pages site (workflow source)"
          else
            echo "Pages already enabled"
          fi

  build:
    needs: enable-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /BACKEND-ELCLASSICO
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL != '' && vars.PUBLIC_API_URL || 'https://el-classico-api.onrender.com/api' }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
