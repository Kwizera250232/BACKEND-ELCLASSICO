name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static site
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /BACKEND-ELCLASSICO
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL != '' && vars.PUBLIC_API_URL || 'https://el-classico-api.onrender.com/api' }}
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: update GitHub Pages site'
