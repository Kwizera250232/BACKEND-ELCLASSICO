# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: el-classico-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run prisma:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: el-classico-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://kwizera250232.github.io

databases:
  - name: el-classico-db
    plan: free
    region: oregon
